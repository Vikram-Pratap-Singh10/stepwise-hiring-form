<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Stylized Briefcase / Identity Body -->
  <!-- Top handle -->
  <path d="M48 42 C48 34, 80 34, 80 42" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>

  <!-- Monogram HV Motif -->
  <!-- Letter H -->
  <path d="M38 48 L38 88 M58 48 L58 88 M38 68 L58 68" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Letter V -->
  <path d="M70 48 L80 88 L90 48" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small accent dot / check star -->
  <circle cx="96" cy="42" r="4.5" fill="#fef08a"/>
</svg>
